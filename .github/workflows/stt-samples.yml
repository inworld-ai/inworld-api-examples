name: STT sample tests

on:
  pull_request:
    paths:
      - 'stt/**'
      - '.github/workflows/stt-samples.yml'
  push:
    branches: [main]
    paths:
      - 'stt/**'
      - '.github/workflows/stt-samples.yml'

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test stt/js/stream_shutdown.test.js
      - run: python -m unittest discover -s stt/python -p 'test_*.py'
